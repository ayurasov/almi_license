[project]
name = "almi-license-server"
version = "0.1.0"
description = "ALMI licensing server (central and local deployment modes)"
requires-python = ">=3.13,<3.14"
# Versions are pinned; every dependency is registered in docs/dependencies.md.
dependencies = [
    "django==5.2.18",
    "djangorestframework==3.16.1",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "django-environ==0.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==1.19.1",
    "django-stubs[compatible-mypy]==5.2.9",
    "djangorestframework-stubs==3.16.9",
    "import-linter==2.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "almi_license.settings.ci"
pythonpath = ["."]
django_find_project = false
testpaths = ["almi_license", "apps", "infra", "tests"]
addopts = ["--strict-markers"]
