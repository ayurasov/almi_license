[project]
name = "almi-keytool"
version = "0.1.0"
description = "Offline tool for the ALMI root key, certificates and trust bundles (E02-01)"
requires-python = ">=3.13,<3.14"
# Pinned; registered in docs/dependencies.md. Deliberately independent of server/.
dependencies = [
    "click==8.5.0",
    "pynacl==1.6.2",
]

[project.scripts]
almi-keytool = "almi_keytool.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "mypy==1.19.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "TID251"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["nacl", "nacl.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/almi_keytool"]
