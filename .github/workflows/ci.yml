# CI pipeline skeleton (docs/specs/07-environments.md, section 6; E00-06).
# Jobs that have no code yet (console, DL) detect it and skip their steps.
name: ci

on:
  pull_request:
  push:
    branches: [stage1, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags after v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --project server --frozen
      - run: make lint-server

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags after v7
        with:
          version: ${{ env.UV_VERSION }}
      # OpenAPI validity, JSON Schemas and their examples, docs/specs/02 examples;
      # comparison with drf-spectacular comes with Product API endpoints.
      - run: make contract-check

  keytool:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags after v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: tools/almi-keytool/uv.lock
      - run: make lint-keytool
      - run: make test-keytool

  vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags after v7
        with:
          version: ${{ env.UV_VERSION }}
      # Reference vectors are reproducible and valid; server and DL runs join with E02-03, E04-01, E13-02.
      - run: make vectors

  arch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags after v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --project server --frozen
      - name: import-linter
        working-directory: server
        run: uv run lint-imports

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
      # Whole history; exceptions are in .gitleaks.toml and .gitleaksignore.
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .

  test-server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: almi_license }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/almi_license
      DJANGO_SETTINGS_MODULE: almi_license.settings.ci
      DEPLOYMENT_MODE: central
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no floating major tags after v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --project server --frozen
      - name: Migrations are in sync with models
        working-directory: server
        run: uv run python manage.py makemigrations --check --dry-run
      # Per-module thresholds (activation, policy, signing >= 85 %) come with tools/coverage_gate.py.
      - name: pytest with coverage
        working-directory: server
        run: uv run pytest --cov --cov-report=term --cov-fail-under=70

  test-dl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f sdk/cpp/CMakeLists.txt ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::sdk/cpp has no CMakeLists.txt yet (I0-04); skipped"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: ./.github/actions/setup-vcpkg
      # Toolchain: CMakeLists.txt picks vcpkg from VCPKG_ROOT; Windows uses the x64-windows-static triplet.
      - if: steps.detect.outputs.present == 'true'
        run: cmake -S sdk/cpp -B build -DCMAKE_BUILD_TYPE=Release -DLM_TRUST_ROOTS=ci
      - if: steps.detect.outputs.present == 'true'
        run: cmake --build build --config Release --parallel
      - if: steps.detect.outputs.present == 'true'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: ASan and UBSan (docs/specs/06-ai-rules.md, 4.3)
        if: steps.detect.outputs.present == 'true' && runner.os == 'Linux'
        run: |
          cmake -S sdk/cpp -B build-san -DCMAKE_BUILD_TYPE=Debug -DLM_TRUST_ROOTS=ci -DLM_SANITIZE=ON
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure
      - if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: license_module-${{ runner.os }}
          if-no-files-found: error
          path: |
            build/bin/**/license_module.dll
            build/bin/**/liblicense_module.so*
            build/bin/**/lm-demo
            build/bin/**/lm-demo.exe
            build/lib/**/license_module.lib
            sdk/cpp/include/license_module.h

  lint-dl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f sdk/cpp/CMakeLists.txt ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::sdk/cpp has no CMakeLists.txt yet (I0-04); skipped"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v10.3.2  # no floating major tags after v7
        with:
          version: ${{ env.UV_VERSION }}
      - if: steps.detect.outputs.present == 'true'
        uses: ./.github/actions/setup-vcpkg
      # clang-format is pinned in the Makefile (same version as pre-commit); clang-tidy comes with the runner.
      - if: steps.detect.outputs.present == 'true'
        run: make lint-dl DL_CMAKE_ARGS=-DLM_TRUST_ROOTS=ci

  lint-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f console/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::console/ is empty (I2-07); skipped"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: console
        run: |
          npm ci
          npx eslint . --max-warnings=0
          npx vue-tsc --noEmit

  test-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f console/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::console/ is empty (I2-07); skipped"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: console
        run: |
          npm ci
          npx vitest run
