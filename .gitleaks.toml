# gitleaks configuration (used by pre-commit and the CI job "secrets").
# Default rules plus one exception: dev and test keys of the stands are public by
# design (docs/specs/07-environments.md, section 3) and live in contracts/vectors/keys/; JWS and
# request-signature vectors signed with them are generated and verified by make vectors.
# Decision of 23.10.2026, docs/decisions.md.
[extend]
useDefault = true

[[allowlists]]
description = "Public dev/test keys and artifacts signed with them; make vectors fails if these files differ from tools/vectors/generate.py output"
paths = ['''^contracts/vectors/(keys|jws|request-signature)/''']
