        default_profile_code:
          type: string
    PatchedSettings:
      type: object
      properties:
        limit:
          type: integer
        reserve_pct:
          type: integer
          nullable: true
        metric_id:
          type: string
          format: uuid
        enforcement:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: object
          additionalProperties:
            type: string
        default_metric_id:
          type: string
          format: uuid
        default_metric:
          type: string
        editions:
          type: array
          items:
            $ref: '#/components/schemas/Edition'
      required:
      - code
      - default_metric
      - default_metric_id
      - editions
      - id
      - name
    ProductCreate:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: object
          additionalProperties:
            type: string
        subject_type:
          $ref: '#/components/schemas/SubjectTypeEnum'
        default_metric_id:
          type: string
          format: uuid
        default_profile_code:
          type: string
          default: ''
      required:
      - code
      - default_metric_id
      - name
      - subject_type
    ProductDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: object
          additionalProperties:
            type: string
        status:
          $ref: '#/components/schemas/ProductStatusEnum'
        subject_type:
          $ref: '#/components/schemas/SubjectTypeEnum'
        default_metric_id:
          type: string
          format: uuid
        default_profile_code:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        editions:
          type: array
          items:
            $ref: '#/components/schemas/EditionDetails'
      required:
      - capabilities
      - code
      - default_metric_id
      - default_profile_code
      - editions
      - id
      - name
      - status
      - subject_type
    ProductStatusEnum:
      enum:
      - active
      - reserved
      - deprecated
      type: string
      description: |-
        * `active` - active
        * `reserved` - reserved
        * `deprecated` - deprecated
    Profile:
      type: object
      properties:
        code:
          type: string
        version:
          type: integer
        params:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
      - code
      - created_at
      - params
      - version
    ProfileSave:
      type: object
      properties:
        params:
          type: object
          additionalProperties: {}
      required:
      - params
    Reason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
      required:
      - reason
    RegistrationCode:
      type: object
      description: The code is shown once; the server keeps only its hash (E09-02).
      properties:
        server:
          $ref: '#/components/schemas/LocalServer'
        code:
          type: string
      required:
      - code
      - server
    Renew:
      type: object
      properties:
        valid_until:
          type: string
          format: date-time
          nullable: true
        support_until:
          type: string
          format: date-time
          nullable: true
        limit:
          type: integer
          nullable: true
      required:
      - valid_until
    RoleEnum:
      enum:
      - operator
      - admin
      - customer_viewer
      type: string
      description: |-
        * `operator` - operator
        * `admin` - admin
        * `customer_viewer` - customer_viewer
    Session:
      type: object
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - username
    SessionRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 256
      required:
      - password
      - username
    SetupRequest:
      type: object
      properties:
        registration_code:
          type: string
          maxLength: 64
        central_url:
          type: string
          default: ''
          maxLength: 256
      required:
      - registration_code
    SetupResult:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LocalStatus'
        request_file:
          allOf:
          - $ref: '#/components/schemas/AlkFile'
          nullable: true
      required:
      - request_file
      - status
    Stats:
      type: object
      properties:
        licenses:
          type: integer
        limit:
          type: integer
        active:
          type: integer
        in_reserve:
          type: integer
        free:
          type: integer
        released_auto:
          type: integer
        conflicts:
          type: integer
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        by_version:
          type: object
          additionalProperties:
            type: integer
        by_os:
          type: object
          additionalProperties:
            type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LicenseStats'
      required:
      - active
      - by_os
      - by_version
      - conflicts
      - free
      - in_reserve
      - last_seen_at
      - licenses
      - limit
      - released_auto
      - rows
    SubjectTypeEnum:
      enum:
      - device
      - server_instance
      - os_node
      type: string
      description: |-
        * `device` - device
        * `server_instance` - server_instance
        * `os_node` - os_node
    Transfer:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
        customer_id:
          type: string
          format: uuid
        document:
          type: string
          default: ''
          maxLength: 256
      required:
      - customer_id
      - reason
    TypeEnum:
      enum:
      - subscription
      - perpetual
      - trial
      - nfr
      - free
      type: string
      description: |-
        * `subscription` - subscription
        * `perpetual` - perpetual
        * `trial` - trial
        * `nfr` - nfr
        * `free` - free
    Usage:
      type: object
      properties:
        active:
          type: integer
        in_reserve:
          type: integer
        released_auto:
          type: integer
        conflicts:
          type: integer
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        by_version:
          type: object
          additionalProperties:
            type: integer
        by_os:
          type: object
          additionalProperties:
            type: integer
      required:
      - active
      - by_os
      - by_version
      - conflicts
      - in_reserve
      - last_seen_at
      - released_auto
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: sessionid
