components:
  schemas:
    Activation:
      type: object
      properties:
        activation_id:
          type: string
        license_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        instance_name:
          type: string
        subject_type:
          type: string
        status:
          $ref: '#/components/schemas/ActivationStatusEnum'
        in_reserve:
          type: boolean
        product_version:
          type: string
        os:
          type: object
          additionalProperties: {}
        activated_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
      required:
      - activated_at
      - activation_id
      - in_reserve
      - instance_id
      - instance_name
      - last_seen_at
      - license_id
      - os
      - product_version
      - released_at
      - status
      - subject_type
    ActivationPage:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Activation'
      required:
      - count
      - results
    ActivationStatusEnum:
      enum:
      - active
      - released
      - released_auto
      - revoked
      - conflict
      type: string
      description: |-
        * `active` - active
        * `released` - released
        * `released_auto` - released_auto
        * `revoked` - revoked
        * `conflict` - conflict
    Capability:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 48
        name:
          type: object
          additionalProperties:
            type: string
        status:
          $ref: '#/components/schemas/CapabilityStatusEnum'
      required:
      - code
      - id
    CapabilityCreate:
      type: object
      properties:
        code:
          type: string
          maxLength: 48
        name:
          type: object
          additionalProperties:
            type: string
      required:
      - code
    CapabilityStatusEnum:
      enum:
      - active
      - deprecated
      type: string
      description: |-
        * `active` - active
        * `deprecated` - deprecated
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 512
        inn:
          type: string
          maxLength: 12
        external_id:
          type: string
          maxLength: 128
        status:
          $ref: '#/components/schemas/CustomerStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - external_id
      - id
      - inn
      - name
      - status
    CustomerPage:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
      required:
      - count
      - results
    CustomerStatusEnum:
      enum:
      - active
      - archived
      type: string
      description: |-
        * `active` - active
        * `archived` - archived
    CustomerWrite:
      type: object
      description: Fields an operator sends; checks of values are in licensing.domain
        (AGENTS.md, rule 2).
      properties:
        name:
          type: string
