paths:
  /api/admin/activations:
    get:
      operationId: activations_list
      parameters:
      - in: query
        name: license_id
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          type: string
          default: -last_seen_at
          minLength: 1
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
      - in: query
        name: search
        schema:
          type: string
          default: ''
      - in: query
        name: status
        schema:
          type: string
          default: ''
      tags:
      - activations
      security:
      - consoleSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationPage'
          description: ''
