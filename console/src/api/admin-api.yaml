              $ref: '#/components/schemas/AccountCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      security:
      - consoleSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedPassword'
          description: ''
