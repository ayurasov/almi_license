# Pre-commit hooks (E00-05). Install: pre-commit install
# Server linters read configuration from server/pyproject.toml (I0-02),
# eslint from console/ (I2-07), clang-format from sdk/cpp/.clang-format (I0-04).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        files: ^sdk/cpp/
        types_or: [c, c++]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Uses eslint from console/package.json, so no extra dependency is pinned here.
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd console && npx --no-install eslint --max-warnings=0 "${@#console/}"' --
        files: ^console/.*\.(ts|tsx|js|mjs|cjs|vue)$
