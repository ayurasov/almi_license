<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="650" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">П5. Поступление лицензий из личного кабинета АльтерСофт</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Этап 1 — выгрузка XLSX без изменения ЛК. Этап 2 — Integration API и вебхуки; продукты не затрагиваются.</text><path d="M1252.5,164.0 L1252.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M917.5,164.0 L917.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M582.5,164.0 L582.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M247.5,164.0 L247.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="132.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#08427B" stroke="#052E56" stroke-width="1.5"/><text x="247.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Менеджер</text><text x="247.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#D6E4F5" text-anchor="middle">АЛМИ</text><rect x="467.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#5B7083" stroke="#3F5162" stroke-width="1.5"/><text x="582.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Личный кабинет</text><text x="582.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#E1E8EE" text-anchor="middle">lk.alter-os.ru</text><rect x="802.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#08427B" stroke="#052E56" stroke-width="1.5"/><text x="917.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Оператор</text><text x="917.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#D6E4F5" text-anchor="middle">АЛМИ</text><rect x="1137.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="1252.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Сервер лицензирования</text><text x="1252.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#DCEAF8" text-anchor="middle">центральный</text><path d="M247.5,226.0 L582.5,226.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M40,248.0 L1460,248.0" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="3 3"/><path d="M917.5,294.0 L582.5,294.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M917.5,346.0 L1252.5,346.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1252.5,362.0 L1286.5,362.0 L1286.5,416.0 L1254.5,416.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M40,440.0 L1460,440.0" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="3 3"/><path d="M582.5,486.0 L1252.5,486.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1252.5,522.0 L582.5,522.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M1252.5,558.0 L582.5,558.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,594.0 L1252.5,594.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><rect x="278.4" y="192.0" width="273.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="204.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1. Генерирует ключи и сертификат по заказу</text><rect x="382.3" y="208.0" width="65.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="220.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">(RegData)</text><rect x="699.6" y="237.0" width="100.8" height="22" rx="11" fill="#EEF3F8" stroke="#B5C7DA"/><text x="750.0" y="252.5" font-family="Noto Sans" font-size="12.5" font-weight="bold" fill="#2F4F6F" text-anchor="middle">Этап 1 (MVP)</text><rect x="645.0" y="276.0" width="210.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="288.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">2. Выгружает ключи заказа в XLSX</text><rect x="937.5" y="312.0" width="295.1" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="324.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3. Загружает XLSX в веб-консоль: предпросмотр,</text><rect x="941.4" y="328.0" width="287.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="340.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">сопоставление артикула с продуктом и сроком</text><rect x="1292.5" y="363.0" width="250.7" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="375.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">4. Создаёт заказчика, лицензии и ключи;</text><rect x="1292.5" y="379.0" width="277.5" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="391.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">повторная загрузка идемпотентна по номеру</text><rect x="1292.5" y="395.0" width="45.3" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="407.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">ключа</text><rect x="719.4" y="429.0" width="61.3" height="22" rx="11" fill="#EEF3F8" stroke="#B5C7DA"/><text x="750.0" y="444.5" font-family="Noto Sans" font-size="12.5" font-weight="bold" fill="#2F4F6F" text-anchor="middle">Этап 2</text><rect x="632.4" y="468.0" width="570.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="917.5" y="480.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">5. POST /api/integration/v1/licenses {order, customer, article, keys[], term}; HMAC, Idempotency-Key</text><rect x="844.1" y="504.0" width="146.8" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="917.5" y="516.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">6. 201: license_id, статус</text><rect x="654.4" y="540.0" width="526.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="917.5" y="552.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">7. Вебхуки: activation.created, seats.changed, license.expiring (повтор до подтверждения)</text><rect x="686.6" y="576.0" width="461.8" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="917.5" y="588.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">8. GET /api/integration/v1/licenses/{id}/usage — остатки для карточки клиента</text></svg>