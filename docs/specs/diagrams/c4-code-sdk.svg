<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1150" viewBox="0 0 1920 1150"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1920" height="1150" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">C4. Уровень кода: модуль лицензирования в продукте (DL, license_module)</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Библиотека C++17 с C ABI. Одинакова для Windows и Linux; продукт работает только через license_module.h (имена функций сохранены из ТЗ).</text><rect x="640.0" y="82.0" width="640.0" height="90.0" rx="10" ry="10" fill="#5B7083" stroke="#3F5162" stroke-width="1.6"/><text x="960.0" y="113.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Код продукта (АльтерОфис Desktop и др.)</text><text x="960.0" y="128.0" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E1E8EE" text-anchor="middle">[C++]</text><text x="960.0" y="151.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Вызывает API модуля, показывает уведомления, включает и отключает функции</text><rect x="640.0" y="225.0" width="640.0" height="158.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="640" y="225" width="640" height="46" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="960.0" y="242.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#3D5A7A" text-anchor="middle" font-style="italic">«публичный C ABI, версия 1»</text><text x="960.0" y="261.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">license_module.h</text><text x="648.0" y="289.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">LM_Initialize(app_version) / LM_InitializeEx(LM_Config*) / LM_Shutdown()</text><text x="648.0" y="306.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">LM_Activate(short_key, mode)  /  LM_Deactivate()</text><text x="648.0" y="323.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">LM_GetStatus(LM_LicenseStatus*)  /  LM_HasFeature(name)</text><text x="648.0" y="340.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">LM_GenerateOfflineRequest(key, path)  /  LM_ActivateFromFile(path)</text><text x="648.0" y="357.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">LM_CheckNow()  /  LM_ReportUsage(LM_Usage*)</text><text x="648.0" y="374.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">LM_SetCallback(LM_EventCallback, void* ctx)</text><rect x="30.0" y="520.0" width="470.0" height="107.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="30" y="520" width="470" height="46" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="265.0" y="537.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#3D5A7A" text-anchor="middle" font-style="italic">«фоновый поток»</text><text x="265.0" y="556.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">Scheduler</text><text x="38.0" y="584.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ start(interval_h = 24, jitter)</text><text x="38.0" y="601.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ trigger_now()</text><text x="38.0" y="618.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">- on_network_up()</text><rect x="640.0" y="500.0" width="640.0" height="158.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="640" y="500" width="640" height="46" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="960.0" y="517.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#3D5A7A" text-anchor="middle" font-style="italic">«фасад, потокобезопасный»</text><text x="960.0" y="536.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">LicenseClient</text><text x="648.0" y="564.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ activate(key) -&gt; Result</text><text x="648.0" y="581.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ check() -&gt; Result</text><text x="648.0" y="598.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ release() -&gt; Result</text><text x="648.0" y="615.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ status() -&gt; Status  /  has_feature(name) -&gt; bool</text><text x="648.0" y="632.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ export_request() -&gt; AlkReq  /  import_response(AlkLic)</text><text x="648.0" y="649.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ subscribe(callback)</text><rect x="1420.0" y="520.0" width="470.0" height="74.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="1420" y="520" width="470" height="30" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="1655.0" y="543.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">OfflineFiles</text><text x="1428.0" y="568.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ build_request(identity, key) -&gt; .alk-req</text><text x="1428.0" y="585.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ parse_response(bytes) -&gt; SignedLease</text><rect x="30.0" y="790.0" width="340.0" height="107.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="30" y="790" width="340" height="46" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="200.0" y="807.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#3D5A7A" text-anchor="middle" font-style="italic">«libcurl, TLS 1.2+»</text><text x="200.0" y="826.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">Transport</text><text x="38.0" y="854.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ discover(base_url) -&gt; Endpoints</text><text x="38.0" y="871.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ post(path, body, sig) -&gt; Resp</text><text x="38.0" y="888.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">- retry_with_backoff()</text><rect x="400.0" y="790.0" width="350.0" height="107.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="400" y="790" width="350" height="46" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="575.0" y="807.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#3D5A7A" text-anchor="middle" font-style="italic">«libsodium»</text><text x="575.0" y="826.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">LeaseVerifier</text><text x="408.0" y="854.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ verify(jws) -&gt; Claims</text><text x="408.0" y="871.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">- verify_chain(chain, roots)</text><text x="408.0" y="888.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">- check_aud_exp_seq(claims)</text><rect x="780.0" y="790.0" width="360.0" height="107.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="780" y="790" width="360" height="46" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="960.0" y="807.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#3D5A7A" text-anchor="middle" font-style="italic">«без ввода-вывода»</text><text x="960.0" y="826.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">StateEvaluator</text><text x="788.0" y="854.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ evaluate(claims, now) -&gt; State</text><text x="788.0" y="871.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ capabilities() -&gt; set&lt;string&gt;</text><text x="788.0" y="888.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ messages() -&gt; list&lt;Message&gt;</text><rect x="1170.0" y="790.0" width="340.0" height="108.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="1170" y="790" width="340" height="30" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="1340.0" y="813.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">SecureStore</text><text x="1178.0" y="838.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ save(snapshot)</text><text x="1178.0" y="855.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ load() -&gt; Snapshot</text><text x="1178.0" y="872.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Windows: DPAPI</text><text x="1178.0" y="889.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">Linux: файл 0600, шифрование</text><rect x="1540.0" y="790.0" width="350.0" height="91.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="1540" y="790" width="350" height="30" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="1715.0" y="813.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">InstanceIdentity</text><text x="1548.0" y="838.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ instance_id() -&gt; UUID</text><text x="1548.0" y="855.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ fingerprint() -&gt; map&lt;string,hash&gt;</text><text x="1548.0" y="872.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ device_key() -&gt; Ed25519 pair</text><rect x="30.0" y="1000.0" width="340.0" height="95.0" rx="10" ry="10" fill="#1168BD" stroke="#0B4884" stroke-width="1.6"/><text x="200.0" y="1033.0" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Сервер лицензирования</text><text x="200.0" y="1048.0" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#DCEAF8" text-anchor="middle">[Product API v1, HTTPS]</text><text x="200.0" y="1071.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">центральный или локальный</text><rect x="400.0" y="1000.0" width="350.0" height="74.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="400" y="1000" width="350" height="30" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="575.0" y="1023.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">TrustStore</text><text x="408.0" y="1048.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ root_keys() -&gt; list&lt;PubKey&gt;</text><text x="408.0" y="1065.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">корневой ключ АЛМИ встроен в сборку</text><rect x="780.0" y="1000.0" width="360.0" height="108.0" rx="4" ry="4" fill="#FFFFFF" stroke="#5D7FA3" stroke-width="1.3"/><rect x="780" y="1000" width="360" height="30" rx="4" fill="#DCEAF8" stroke="#5D7FA3" stroke-width="1.3"/><text x="960.0" y="1023.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#14324F" text-anchor="middle">RollbackGuard + TrialTracker</text><text x="788.0" y="1048.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ trusted_now() -&gt; time</text><text x="788.0" y="1065.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ observe(server_time)</text><text x="788.0" y="1082.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">+ trial_days_left() -&gt; int</text><text x="788.0" y="1099.0" font-family="Noto Sans Mono" font-size="11.5" font-weight="normal" fill="#222" text-anchor="start">first_launch_ts в нескольких хранилищах</text><path d="M960.0,172.0 L960.0,225.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M960.0,383.0 L960.0,500.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M500.0,570.0 L640.0,570.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M1280.0,570.0 L1420.0,570.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M960,658 L960,745 M200,745 L1715,745" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4"/><path d="M200.0,745.0 L200.0,790.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M575.0,745.0 L575.0,790.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M960.0,745.0 L960.0,790.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M1340.0,745.0 L1340.0,790.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M1715.0,745.0 L1715.0,790.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M200.0,897.0 L200.0,1000.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M575.0,897.0 L575.0,1000.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M960.0,897.0 L960.0,1000.0" fill="none" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrO)"/><rect x="1170.0" y="1000.0" width="720.0" height="52.0" rx="6" ry="6" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.2"/><text x="1180.0" y="1024.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">Колбэк продукта вызывается при смене состояния (ACTIVE, NOTICE, GRACE, RESTRICTED, BLOCKED) и при появлении</text><text x="1180.0" y="1041.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">сообщений сервера. Продукт не разбирает аренду сам: решения о функциях принимаются через LM_HasFeature().</text><rect x="976.2" y="186.0" width="67.6" height="24.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1010.0" y="204.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">вызывает</text><rect x="921.9" y="458.0" width="76.2" height="24.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="960.0" y="476.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">делегирует</text><rect x="518.6" y="533.0" width="102.8" height="24.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="570.0" y="551.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">запускает check</text><rect x="1300.7" y="533.0" width="98.7" height="24.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1350.0" y="551.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">офлайн-режим</text><rect x="176.8" y="958.0" width="46.3" height="24.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="200.0" y="976.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">HTTPS</text></svg>