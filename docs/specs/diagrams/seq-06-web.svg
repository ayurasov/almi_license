.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="220.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">/apps/zammad_organisation_management/api/query/subscription/{key}</text><rect x="277.6" y="224.0" width="274.7" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="236.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">{instanceId, userCount, activeUserCount, apps,</text><rect x="387.0" y="240.0" width="55.9" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="252.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">version}</text><rect x="612.5" y="276.0" width="274.9" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="288.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">2. activate или check для instance_id (subject =</text><rect x="631.2" y="292.0" width="237.6" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="304.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">server_instance), usage = пользователи</text><rect x="989.8" y="328.0" width="190.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="340.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3. учёт активации и счётчиков</text><rect x="630.3" y="364.0" width="239.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="376.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">состояние, срок, лимит пользователей</text><rect x="263.2" y="400.0" width="303.6" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="412.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">4. 200 {endDate, extendedSupport, amountOfUsers,</text><rect x="283.5" y="416.0" width="263.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="428.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">onlyCountActiveUsers, accountManagerInfo}</text><rect x="287.5" y="451.0" width="284.1" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="291.5" y="463.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">5. Штатная логика Nextcloud: предупреждения</text><rect x="287.5" y="467.0" width="236.6" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="291.5" y="479.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">о сроке и превышении пользователей</text><rect x="157.5" y="506.0" width="850.0" height="46.0" rx="5" ry="5" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.1"/><text x="582.5" y="525.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">Этап 2: приложение alter_license с PHP SDK переходит на Product API v1 и получает подписанную аренду; адаптер остаётся для старых</text><text x="582.5" y="541.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">версий.</text></svg>