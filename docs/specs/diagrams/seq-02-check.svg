<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="868" viewBox="0 0 1500 868"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="868" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">П2. Периодическая проверка, продление аренды и директивы сервера</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Раз в check_interval_hours (по умолчанию 24 ч) и при старте продукта. Без сети продукт работает по сохранённой аренде.</text><path d="M1252.5,164.0 L1252.5,838.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M917.5,164.0 L917.5,838.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M582.5,164.0 L582.5,838.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M247.5,164.0 L247.5,838.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="50" y="714.0" width="1400" height="100.0" fill="#FAFBFD" stroke="#9AA9B8" stroke-width="1" rx="4"/><path d="M50,714.0 h136.6 v14 l-8,8 h-128.6 z" fill="#E3EAF2" stroke="#9AA9B8"/><text x="58" y="730.0" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#2F4F6F">Сервер недоступен</text><rect x="50" y="596.0" width="1400" height="100.0" fill="#FAFBFD" stroke="#9AA9B8" stroke-width="1" rx="4"/><path d="M50,596.0 h449.1 v14 l-8,8 h-441.1 z" fill="#E3EAF2" stroke="#9AA9B8"/><text x="58" y="612.0" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#2F4F6F">Директивы: refresh_now, rebind, release, set_server_url, show_message</text><rect x="50" y="442.0" width="1400" height="136.0" fill="#FAFBFD" stroke="#9AA9B8" stroke-width="1" rx="4"/><path d="M50,442.0 h162.9 v14 l-8,8 h-154.9 z" fill="#E3EAF2" stroke="#9AA9B8"/><text x="58" y="458.0" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#2F4F6F">Состояние изменилось</text><rect x="132.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#5B7083" stroke="#3F5162" stroke-width="1.5"/><text x="247.5" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Продукт</text><rect x="467.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#85BBF0" stroke="#5D9CD9" stroke-width="1.5"/><text x="582.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#0B2A4A" text-anchor="middle">Модуль лицензирования</text><text x="582.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#1E4670" text-anchor="middle">Scheduler + LicenseClient</text><rect x="802.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="917.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Сервер лицензирования</text><text x="917.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#DCEAF8" text-anchor="middle">Product API v1</text><rect x="1137.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#85BBF0" stroke="#5D9CD9" stroke-width="1.5"/><text x="1252.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#0B2A4A" text-anchor="middle">PolicyEngine</text><text x="1252.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#1E4670" text-anchor="middle">на сервере</text><path d="M582.5,242.0 L917.5,242.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M917.5,278.0 L1252.5,278.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1252.5,314.0 L917.5,314.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M917.5,366.0 L582.5,366.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M582.5,382.0 L616.5,382.0 L616.5,420.0 L584.5,420.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,504.0 L247.5,504.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M247.5,520.0 L281.5,520.0 L281.5,558.0 L249.5,558.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,622.0 L616.5,622.0 L616.5,676.0 L584.5,676.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,740.0 L616.5,740.0 L616.5,794.0 L584.5,794.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><rect x="606.9" y="192.0" width="286.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="204.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1. POST /api/v1/activations/{id}/check {lease_seq,</text><rect x="602.3" y="208.0" width="295.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="220.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">version, usage: {users, active_users, documents...},</text><rect x="665.3" y="224.0" width="169.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="236.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">client_time}; ALMI-Signature</text><rect x="938.6" y="260.0" width="292.7" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="272.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">2. evaluate(лицензия, активация, профиль, now)</text><rect x="984.0" y="296.0" width="202.1" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="308.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">состояние, функции, сообщения</text><rect x="607.8" y="332.0" width="284.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="344.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3. 200: новая аренда (seq+1), policy, directives[],</text><rect x="634.4" y="348.0" width="231.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="360.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">messages[], server_time, next_check_at</text><rect x="622.5" y="383.0" width="292.1" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="395.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">4. Проверяет аренду; seq должен расти; сверяет</text><rect x="622.5" y="399.0" width="137.2" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="411.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">время (RollbackGuard)</text><rect x="279.4" y="470.0" width="271.1" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="482.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">5. колбэк on_state_changed(NOTICE / GRACE /</text><rect x="316.5" y="486.0" width="196.9" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="498.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">RESTRICTED / BLOCKED / ACTIVE)</text><rect x="287.5" y="521.0" width="288.6" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="291.5" y="533.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">6. Показывает уведомление, ограничивает или</text><rect x="287.5" y="537.0" width="163.0" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="291.5" y="549.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">восстанавливает функции</text><rect x="622.5" y="623.0" width="266.0" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="635.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">7. Выполняет поддерживаемые директивы;</text><rect x="622.5" y="639.0" width="238.4" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="651.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">неизвестные игнорирует и сообщает в</text><rect x="622.5" y="655.0" width="112.4" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="667.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">следующем check</text><rect x="622.5" y="741.0" width="259.6" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="753.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">8. Повтор с экспоненциальной задержкой;</text><rect x="622.5" y="757.0" width="206.0" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="769.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">продолжает работу до lease.exp +</text><rect x="622.5" y="773.0" width="111.9" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="785.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">offline_grace_days</text></svg>