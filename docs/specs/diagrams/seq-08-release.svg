<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="650" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">П8. Освобождение места: явное и автоматическое</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Удаление продукта, перенос на другой ПК или отсутствие связи дольше release_after_days.</text><path d="M1252.5,164.0 L1252.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M917.5,164.0 L917.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M582.5,164.0 L582.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M247.5,164.0 L247.5,620.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="132.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#5B7083" stroke="#3F5162" stroke-width="1.5"/><text x="247.5" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Продукт</text><rect x="467.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#85BBF0" stroke="#5D9CD9" stroke-width="1.5"/><text x="582.5" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#0B2A4A" text-anchor="middle">Модуль</text><rect x="802.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="917.5" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Сервер лицензирования</text><rect x="1137.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/><text x="1252.5" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Фоновый обработчик</text><path d="M40,196.0 L1460,196.0" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="3 3"/><path d="M247.5,258.0 L582.5,258.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,310.0 L917.5,310.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M917.5,346.0 L582.5,346.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M582.5,362.0 L616.5,362.0 L616.5,400.0 L584.5,400.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M40,424.0 L1460,424.0" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="3 3"/><path d="M1252.5,450.0 L1286.5,450.0 L1286.5,504.0 L1254.5,504.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,542.0 L917.5,542.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M917.5,594.0 L582.5,594.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><rect x="670.4" y="185.0" width="159.1" height="22" rx="11" fill="#EEF3F8" stroke="#B5C7DA"/><text x="750.0" y="200.5" font-family="Noto Sans" font-size="12.5" font-weight="bold" fill="#2F4F6F" text-anchor="middle">Явное освобождение</text><rect x="269.8" y="224.0" width="290.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="236.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1. LM_Deactivate() — при деинсталляции или по</text><rect x="342.4" y="240.0" width="145.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="252.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">команде пользователя</text><rect x="633.6" y="276.0" width="232.8" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="288.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">2. POST /api/v1/activations/{id}/release;</text><rect x="701.4" y="292.0" width="97.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="304.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">ALMI-Signature</text><rect x="643.4" y="328.0" width="213.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="340.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3. 200: квитанция; место свободно</text><rect x="622.5" y="363.0" width="254.2" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="375.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">4. Удаляет аренду, переходит в состояние</text><rect x="622.5" y="379.0" width="81.6" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="391.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">UNLICENSED</text><rect x="635.4" y="413.0" width="229.2" height="22" rx="11" fill="#EEF3F8" stroke="#B5C7DA"/><text x="750.0" y="428.5" font-family="Noto Sans" font-size="12.5" font-weight="bold" fill="#2F4F6F" text-anchor="middle">Автоматическое освобождение</text><rect x="1292.5" y="451.0" width="254.9" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="463.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">5. Ежечасно: активации без check дольше</text><rect x="1292.5" y="467.0" width="275.6" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="479.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">release_after_days (30) — статус released_auto,</text><rect x="1292.5" y="483.0" width="41.0" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="495.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">аудит</text><rect x="603.3" y="524.0" width="293.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="536.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">6. Позже продукт снова выходит на связь: check</text><rect x="609.7" y="560.0" width="280.7" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="572.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">7. 410 activation_released — модуль повторяет</text><rect x="673.3" y="576.0" width="153.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="588.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">activate, если есть место</text></svg>