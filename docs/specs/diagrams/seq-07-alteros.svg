<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="436" viewBox="0 0 1500 436"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="436" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">П7. АльтерОС: регистрация существующим скриптом registration.sh</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Этап 1: адаптер повторяет старый контракт /api/activate/. Этап 2: агент almi-license-agent на Product API v1.</text><path d="M1196.7,164.0 L1196.7,406.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M750.0,164.0 L750.0,406.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M303.3,164.0 L303.3,406.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="188.3" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#5B7083" stroke="#3F5162" stroke-width="1.5"/><text x="303.3" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Узел АльтерОС</text><text x="303.3" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#E1E8EE" text-anchor="middle">registration.sh</text><rect x="635.0" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#85BBF0" stroke="#5D9CD9" stroke-width="1.5"/><text x="750.0" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#0B2A4A" text-anchor="middle">Адаптер legacy</text><text x="750.0" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#1E4670" text-anchor="middle">/api/activate/</text><rect x="1081.7" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#85BBF0" stroke="#5D9CD9" stroke-width="1.5"/><text x="1196.7" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#0B2A4A" text-anchor="middle">ActivationService</text><path d="M303.3,226.0 L750.0,226.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M750.0,262.0 L1196.7,262.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1196.7,298.0 L750.0,298.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M750.0,334.0 L303.3,334.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><rect x="400.7" y="192.0" width="252.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="526.7" y="204.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1. GET или POST /api/activate/?data=&lt;MD5</text><rect x="418.0" y="208.0" width="217.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="526.7" y="220.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">машины&gt;&amp;host=&lt;имя&gt;&amp;lic=&lt;ключ&gt;</text><rect x="819.5" y="244.0" width="307.6" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="973.3" y="256.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">2. activate(key, instance_id = data, subject = os_node)</text><rect x="939.6" y="280.0" width="67.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="973.3" y="292.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">результат</text><rect x="341.9" y="316.0" width="369.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="526.7" y="328.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3. Ответ в прежнем формате (код и текст), понятный скрипту</text><rect x="213.3" y="350.0" width="1073.3" height="30.0" rx="5" ry="5" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.1"/><text x="750.0" y="369.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">Мягкое ограничение: при ошибке ОС продолжает работать, событие учитывается в статистике и видно оператору.</text></svg>