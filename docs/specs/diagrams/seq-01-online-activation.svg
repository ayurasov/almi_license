<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1132" viewBox="0 0 1500 1132"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="1132" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">П1. Онлайн-активация продукта</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Desktop или любой продукт с SDK; сервер — центральный или локальный, протокол одинаков.</text><path d="M1286.0,164.0 L1286.0,1102.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M1018.0,164.0 L1018.0,1102.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M750.0,164.0 L750.0,1102.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M482.0,164.0 L482.0,1102.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M214.0,164.0 L214.0,1102.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="50" y="868.0" width="1400" height="148.0" fill="#FAFBFD" stroke="#9AA9B8" stroke-width="1" rx="4"/><path d="M50,868.0 h306.3 v14 l-8,8 h-298.3 z" fill="#E3EAF2" stroke="#9AA9B8"/><text x="58" y="884.0" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#2F4F6F">Мест нет / ключ неверен / лицензия отозвана</text><rect x="50" y="594.0" width="1400" height="256.0" fill="#FAFBFD" stroke="#9AA9B8" stroke-width="1" rx="4"/><path d="M50,594.0 h466.8 v14 l-8,8 h-458.8 z" fill="#E3EAF2" stroke="#9AA9B8"/><text x="58" y="610.0" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#2F4F6F">Есть свободное место или это повторная активация того же instance_id</text><rect x="99.0" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="1.5"/><text x="214.0" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Пользователь</text><rect x="367.0" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#5B7083" stroke="#3F5162" stroke-width="1.5"/><text x="482.0" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Продукт</text><text x="482.0" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#E1E8EE" text-anchor="middle">код продукта</text><rect x="635.0" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#85BBF0" stroke="#5D9CD9" stroke-width="1.5"/><text x="750.0" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#0B2A4A" text-anchor="middle">Модуль лицензирования</text><text x="750.0" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#1E4670" text-anchor="middle">DL / WL / SDK</text><rect x="903.0" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="1018.0" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Сервер лицензирования</text><text x="1018.0" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#DCEAF8" text-anchor="middle">Product API v1</text><rect x="1171.0" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/><text x="1286.0" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text><path d="M214.0,226.0 L482.0,226.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M482.0,278.0 L750.0,278.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M750.0,294.0 L784.0,294.0 L784.0,332.0 L752.0,332.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M750.0,386.0 L1018.0,386.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1018.0,438.0 L750.0,438.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M750.0,522.0 L1018.0,522.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1018.0,574.0 L1286.0,574.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1018.0,656.0 L1286.0,656.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1018.0,708.0 L750.0,708.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M750.0,724.0 L784.0,724.0 L784.0,778.0 L752.0,778.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M750.0,832.0 L482.0,832.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M1018.0,946.0 L750.0,946.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M750.0,998.0 L482.0,998.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><rect x="230.8" y="192.0" width="234.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="348.0" y="204.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1. Вводит ключ или продукт берёт его</text><rect x="260.4" y="208.0" width="175.1" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="348.0" y="220.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">из настроек развёртывания</text><rect x="540.5" y="244.0" width="150.9" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="616.0" y="256.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">2. LM_Activate(short_key,</text><rect x="562.1" y="260.0" width="107.8" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="616.0" y="272.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">LM_ACT_ONLINE)</text><rect x="790.0" y="295.0" width="224.2" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="794.0" y="307.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">3. Формирует instance_id, отпечаток,</text><rect x="790.0" y="311.0" width="215.0" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="794.0" y="323.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">пару ключей устройства (один раз)</text><rect x="771.5" y="352.0" width="225.1" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="364.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">4. GET /.well-known/almi-license (если</text><rect x="807.5" y="368.0" width="153.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="380.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">адрес ещё не проверен)</text><rect x="782.0" y="404.0" width="204.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="416.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">200: версии API, адреса методов,</text><rect x="840.1" y="420.0" width="87.8" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="432.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">сертификаты</text><rect x="763.8" y="456.0" width="240.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="468.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">5. POST /api/v1/activations {key, product,</text><rect x="788.4" y="472.0" width="191.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="484.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">version, instance_id, fingerprint,</text><rect x="787.2" y="488.0" width="193.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="500.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">device_pubkey}; ALMI-Signature,</text><rect x="829.8" y="504.0" width="108.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="516.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Idempotency-Key</text><rect x="1028.5" y="540.0" width="247.1" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1152.0" y="552.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">6. BEGIN; SELECT лицензию FOR UPDATE;</text><rect x="1078.2" y="556.0" width="147.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1152.0" y="568.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">подсчёт активных мест</text><rect x="1043.0" y="622.0" width="218.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1152.0" y="634.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">7. INSERT/UPDATE activation; запись</text><rect x="1099.3" y="638.0" width="105.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1152.0" y="650.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">аудита; COMMIT</text><rect x="768.8" y="674.0" width="230.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="686.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">8. 201: activation_id, lease (JWS), policy,</text><rect x="808.5" y="690.0" width="150.9" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="702.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">messages, next_check_at</text><rect x="790.0" y="725.0" width="217.9" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="794.0" y="737.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">9. Проверяет подпись и цепочку до</text><rect x="790.0" y="741.0" width="215.9" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="794.0" y="753.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">корневого ключа АЛМИ, сохраняет</text><rect x="790.0" y="757.0" width="130.5" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="794.0" y="769.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">аренду в SecureStore</text><rect x="505.8" y="798.0" width="220.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="616.0" y="810.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">10. результат OK, состояние ACTIVE,</text><rect x="585.1" y="814.0" width="61.7" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="616.0" y="826.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">функции</text><rect x="797.0" y="896.0" width="174.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="908.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">11. 409 seats_exhausted, 404</text><rect x="764.2" y="912.0" width="239.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="924.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">key_not_found, 403 license_revoked (RFC</text><rect x="863.5" y="928.0" width="41.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="884.0" y="940.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">9457)</text><rect x="506.5" y="964.0" width="219.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="616.0" y="976.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">12. код ошибки и текст сервера для</text><rect x="546.8" y="980.0" width="138.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="616.0" y="992.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">показа пользователю</text><rect x="660.0" y="1030.0" width="448.0" height="46.0" rx="5" ry="5" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.1"/><text x="884.0" y="1049.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">Повтор запроса с тем же Idempotency-Key возвращает прежний ответ</text><text x="884.0" y="1065.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">— двойного списания места нет.</text></svg>