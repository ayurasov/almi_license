<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="490" viewBox="0 0 1800 490"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1800" height="490" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">Жизненный цикл срока лицензии и политика блокировок</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Параметры задаются профилем политики на сервере и доставляются в аренде. Продукт только исполняет состояние.</text><rect x="80" y="150" width="474" height="70" rx="6" fill="#2E7D32"/><text x="317.0" y="180.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Активна</text><text x="317.0" y="202.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">ACTIVE</text><text x="317.0" y="245.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Полная функциональность</text><rect x="560" y="150" width="294" height="70" rx="6" fill="#9E9D24"/><text x="707.0" y="180.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Напоминание</text><text x="707.0" y="202.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">NOTICE</text><text x="707.0" y="245.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Баннер и уведомления; за notify_before_days</text><text x="707.0" y="261.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">(30) до срока</text><rect x="860" y="150" width="294" height="70" rx="6" fill="#EF8F00"/><text x="1007.0" y="180.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Отсрочка</text><text x="1007.0" y="202.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">GRACE</text><text x="1007.0" y="245.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Работает полностью, настойчивые</text><text x="1007.0" y="261.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">предупреждения; grace_days (14)</text><rect x="1160" y="150" width="294" height="70" rx="6" fill="#D84315"/><text x="1307.0" y="180.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Мягкий блок</text><text x="1307.0" y="202.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">RESTRICTED</text><text x="1307.0" y="245.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Отключены restricted_caps (создание,</text><text x="1307.0" y="261.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">сохранение, новые пользователи);</text><text x="1307.0" y="277.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">restricted_days (30)</text><rect x="1460" y="150" width="254" height="70" rx="6" fill="#B71C1C"/><text x="1587.0" y="180.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Жёсткий блок</text><text x="1587.0" y="202.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="middle">BLOCKED</text><text x="1587.0" y="245.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">Только просмотр/экспорт данных или</text><text x="1587.0" y="261.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">запуск запрещён</text><path d="M80,330 L1730,330" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/><path d="M560,322 L560,338" stroke="#555" stroke-width="1.4"/><text x="560.0" y="356.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">valid_until − 30 дн.</text><path d="M860,322 L860,338" stroke="#555" stroke-width="1.4"/><text x="860.0" y="356.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">valid_until</text><path d="M1160,322 L1160,338" stroke="#555" stroke-width="1.4"/><text x="1160.0" y="356.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">+ grace_days</text><path d="M1460,322 L1460,338" stroke="#555" stroke-width="1.4"/><text x="1460.0" y="356.0" font-family="Noto Sans Mono" font-size="12" font-weight="normal" fill="#333" text-anchor="middle">+ restricted_days</text><rect x="80.0" y="400.0" width="520.0" height="70.5" rx="6" ry="6" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.2"/><text x="90.0" y="424.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">Откат блока: оператор продлевает лицензию или снимает блок. Сервер</text><text x="90.0" y="442.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">выпускает новую аренду с большим seq — при ближайшей проверке продукт</text><text x="90.0" y="459.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">возвращается в ACTIVE. Офлайн-устройству передаётся новый файл .alk-lic.</text><rect x="630.0" y="400.0" width="520.0" height="70.5" rx="6" ry="6" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.2"/><text x="640.0" y="424.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">Режим «прогрев» (enforcement = monitor): состояния вычисляются и</text><text x="640.0" y="442.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">показываются в статистике и консоли, но продукт не ограничивает функции.</text><text x="640.0" y="459.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">Рекомендуется 1–2 месяца после внедрения, затем перевод в enforce.</text><rect x="1180.0" y="400.0" width="540.0" height="70.5" rx="6" ry="6" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.2"/><text x="1190.0" y="424.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">Бессрочная лицензия: срок права не истекает; по этой шкале идёт только срок</text><text x="1190.0" y="442.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">техподдержки (support_until) — продукт показывает уведомление, функции не</text><text x="1190.0" y="459.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#4A3B00" text-anchor="start">ограничиваются. Отзыв (REVOKED) — немедленный переход в жёсткий блок.</text></svg>