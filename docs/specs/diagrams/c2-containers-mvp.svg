<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1190" viewBox="0 0 1920 1190"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1920" height="1190" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">C2. Контейнеры — этап 1 (MVP)</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Минимальный состав, достаточный для релиза. Все контейнеры — из одного Docker-образа, кроме СУБД и шлюза.</text><rect x="420" y="255" width="1100" height="905" rx="12" fill="none" stroke="#7A7A7A" stroke-width="1.4" stroke-dasharray="9 5"/><text x="434" y="1134" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#7A7A7A">Система лицензирования АЛМИ — один экземпляр</text><text x="434" y="1150" font-family="Noto Sans" font-size="11.5" fill="#7A7A7A">Центральный (DEPLOYMENT_MODE=central) или локальный (DEPLOYMENT_MODE=local) — одинаковый состав контейнеров</text><circle cx="780.0" cy="100.0" r="22" fill="#08427B" stroke="#052E56" stroke-width="1.6"/><rect x="650.0" y="118.0" width="260.0" height="112.0" rx="16" ry="16" fill="#08427B" stroke="#052E56" stroke-width="1.6"/><text x="780.0" y="171.5" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Оператор лицензий АЛМИ</text><text x="780.0" y="186.5" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#D6E4F5" text-anchor="middle">[Сотрудник АЛМИ]</text><circle cx="1120.0" cy="100.0" r="22" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="1.6"/><rect x="990.0" y="118.0" width="260.0" height="112.0" rx="16" ry="16" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="1.6"/><text x="1120.0" y="171.5" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Администратор заказчика</text><text x="1120.0" y="186.5" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E6E6E6" text-anchor="middle">[Сотрудник заказчика, только просмотр]</text><rect x="650.0" y="320.0" width="600.0" height="100.0" rx="10" ry="10" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.6"/><text x="950.0" y="347.5" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Веб-консоль</text><text x="950.0" y="362.5" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E8F1FA" text-anchor="middle">[Контейнер: Vue 3, TypeScript, Vite, PrimeVue]</text><text x="950.0" y="385.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Лицензии, активации, пакеты, офлайн-файлы, политики, отчёты; режим просмотра для</text><text x="950.0" y="402.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">заказчика</text><rect x="650.0" y="490.0" width="600.0" height="100.0" rx="10" ry="10" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.6"/><text x="950.0" y="526.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Шлюз</text><text x="950.0" y="541.0" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E8F1FA" text-anchor="middle">[Контейнер: Nginx]</text><text x="950.0" y="564.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">TLS, раздача веб-консоли, маршрутизация API, лимиты частоты и размера запросов</text><rect x="650.0" y="680.0" width="600.0" height="160.0" rx="10" ry="10" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.6"/><text x="950.0" y="737.5" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">API сервера лицензирования</text><text x="950.0" y="752.5" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E8F1FA" text-anchor="middle">[Контейнер: Python 3.13, Django 5.2 LTS, DRF]</text><text x="950.0" y="775.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Product API v1 и адаптеры совместимости, Admin API, Sync API. Доменная логика: права,</text><text x="950.0" y="792.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">активации, аренды, политики, пакеты, аудит. Подпись выполняется встроенным модулем</text><rect x="1290.0" y="680.0" width="200.0" height="160.0" rx="10" ry="10" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.6"/><text x="1390.0" y="712.5" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Фоновый</text><text x="1390.0" y="730.5" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">обработчик</text><text x="1390.0" y="745.5" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E8F1FA" text-anchor="middle">[Контейнер: тот же образ,</text><text x="1390.0" y="760.5" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E8F1FA" text-anchor="middle">планировщик]</text><text x="1390.0" y="783.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Освобождение мест,</text><text x="1390.0" y="800.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">пересчёт состояний,</text><text x="1390.0" y="817.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">отчёты</text><path d="M660,942 a100.0,12 0 0,1 200,0 v101 a100.0,12 0 0,1 -200,0 z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.6"/><path d="M660,942 a100.0,12 0 0,0 200,0" fill="none" stroke="#3C7FC0" stroke-width="1.6"/><text x="760.0" y="974.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Хранилище файлов</text><text x="760.0" y="989.0" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E8F1FA" text-anchor="middle">[Том Docker]</text><text x="760.0" y="1012.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Пакеты, офлайн-файлы,</text><text x="760.0" y="1029.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">выгрузки</text><path d="M900,942 a125.0,12 0 0,1 250,0 v101 a125.0,12 0 0,1 -250,0 z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.6"/><path d="M900,942 a125.0,12 0 0,0 250,0" fill="none" stroke="#3C7FC0" stroke-width="1.6"/><text x="1025.0" y="974.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">База данных</text><text x="1025.0" y="989.0" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E8F1FA" text-anchor="middle">[PostgreSQL 17]</text><text x="1025.0" y="1012.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Каталог, лицензии, активации,</text><text x="1025.0" y="1029.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">аренды, аудит</text><rect x="40.0" y="470.0" width="340.0" height="140.0" rx="10" ry="10" fill="#5B7083" stroke="#3F5162" stroke-width="1.6"/><text x="210.0" y="517.5" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Продукты с модулем лицензирования</text><text x="210.0" y="532.5" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E1E8EE" text-anchor="middle">[Программные системы]</text><text x="210.0" y="555.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Desktop (DL), Web (WL, адаптер Nextcloud),</text><text x="210.0" y="572.5" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">АльтерОС (registration.sh)</text><rect x="40.0" y="680.0" width="340.0" height="130.0" rx="10" ry="10" fill="#5B7083" stroke="#3F5162" stroke-width="1.6"/><text x="210.0" y="731.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Парный экземпляр системы</text><text x="210.0" y="746.0" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E1E8EE" text-anchor="middle">[Центральный или локальный сервер]</text><text x="210.0" y="769.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Регистрация локального сервера, пакеты, отчёты</text><rect x="1620.0" y="470.0" width="270.0" height="140.0" rx="10" ry="10" fill="#5B7083" stroke="#3F5162" stroke-width="1.6"/><text x="1755.0" y="526.0" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Личный кабинет АльтерСофт</text><text x="1755.0" y="541.0" font-family="Noto Sans" font-size="11.5" font-weight="normal" fill="#E1E8EE" text-anchor="middle">[lk.alter-os.ru]</text><text x="1755.0" y="564.0" font-family="Noto Sans" font-size="12.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Выгрузка ключей XLSX (этап 1)</text><path d="M780.0,230.0 L780.0,320.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><path d="M1120.0,230.0 L1120.0,320.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><path d="M950.0,420.0 L950.0,490.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><path d="M950.0,590.0 L950.0,680.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><path d="M380.0,520.0 L650.0,520.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><path d="M380.0,745.0 L560.0,745.0 L560.0,575.0 L650.0,575.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arrS)"/><path d="M1620.0,540.0 L1250.0,540.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M760.0,840.0 L760.0,930.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><path d="M1000.0,840.0 L1000.0,930.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><path d="M1460.0,840.0 L1460.0,1100.0 L1025.0,1100.0 L1025.0,1055.0" fill="none" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1175.0" y="935.0" width="260.0" height="86.0" rx="6" ry="6" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.2"/><text x="1185.0" y="959.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">В MVP нет Redis, отдельного сервиса</text><text x="1185.0" y="976.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">подписи, SSO и мониторинга. Ключ</text><text x="1185.0" y="993.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">подписи — Docker secret, очередь —</text><text x="1185.0" y="1010.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">таблица в PostgreSQL.</text><rect x="1620.0" y="650.0" width="270.0" height="69.0" rx="6" ry="6" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.2"/><text x="1630.0" y="674.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">Интеграция с ЛК по API, письма, единый</text><text x="1630.0" y="691.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">вход и мониторинг добавляются на этапе</text><text x="1630.0" y="708.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="start">2 без изменения продуктов.</text><rect x="730.1" y="256.0" width="99.8" height="38.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="780.0" y="274.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Работает</text><text x="780.0" y="288.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[HTTPS, браузер]</text><rect x="1039.5" y="248.0" width="161.0" height="54.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1120.0" y="266.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Просматривает остатки и</text><text x="1120.0" y="282.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">сроки</text><text x="1120.0" y="296.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[HTTPS, браузер]</text><rect x="890.7" y="436.0" width="118.6" height="38.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="950.0" y="454.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Вызовы Admin API</text><text x="950.0" y="468.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[HTTPS/JSON]</text><rect x="880.8" y="616.0" width="138.5" height="38.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="950.0" y="634.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Проксирует запросы</text><text x="950.0" y="648.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[HTTP, внутренняя сеть]</text><rect x="419.5" y="493.0" width="190.9" height="54.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="515.0" y="511.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Активация, проверка,</text><text x="515.0" y="527.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">освобождение, офлайн-файлы</text><text x="515.0" y="541.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[HTTPS/JSON, Product API v1]</text><rect x="390.1" y="718.0" width="159.8" height="54.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="470.0" y="736.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Регистрация, пакеты,</text><text x="470.0" y="752.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">отчёты</text><text x="470.0" y="766.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[HTTPS Sync API или файлы]</text><rect x="1341.6" y="513.0" width="186.8" height="54.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1435.0" y="531.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Оператор загружает выгрузку</text><text x="1435.0" y="547.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">ключей</text><text x="1435.0" y="561.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[Файл XLSX через веб-консоль]</text><rect x="734.8" y="873.0" width="50.4" height="24.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="760.0" y="891.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Файлы</text><rect x="946.2" y="866.0" width="107.5" height="38.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1000.0" y="884.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Чтение и запись</text><text x="1000.0" y="898.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[SQL]</text><rect x="1186.2" y="1081.0" width="107.5" height="38.0" rx="4" fill="#FFFFFF" fill-opacity="0.94"/><text x="1240.0" y="1099.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">Чтение и запись</text><text x="1240.0" y="1113.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#6A6A6A" text-anchor="middle" font-style="italic">[SQL]</text></svg>