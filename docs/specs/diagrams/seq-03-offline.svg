<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="688" viewBox="0 0 1500 688"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="688" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">П3. Офлайн-активация устройства файлами</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Рабочее место без сети. Ответ готовит центральный сервер (через портал или оператора) либо локальный сервер в контуре.</text><path d="M1252.5,164.0 L1252.5,658.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M917.5,164.0 L917.5,658.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M582.5,164.0 L582.5,658.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M247.5,164.0 L247.5,658.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="132.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="1.5"/><text x="247.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Администратор</text><text x="247.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#E6E6E6" text-anchor="middle">заказчика</text><rect x="467.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#85BBF0" stroke="#5D9CD9" stroke-width="1.5"/><text x="582.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#0B2A4A" text-anchor="middle">Модуль лицензирования</text><text x="582.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#1E4670" text-anchor="middle">на ПК без сети</text><rect x="802.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#8C8C8C" stroke="#6B6B6B" stroke-width="1.5"/><text x="917.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Носитель / почта</text><text x="917.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#F0F0F0" text-anchor="middle">перенос файла</text><rect x="1137.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="1252.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Сервер лицензирования</text><text x="1252.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#DCEAF8" text-anchor="middle">веб-консоль или портал</text><path d="M247.5,226.0 L582.5,226.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,242.0 L616.5,242.0 L616.5,296.0 L584.5,296.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,334.0 L917.5,334.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M917.5,386.0 L1252.5,386.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1252.5,402.0 L1286.5,402.0 L1286.5,440.0 L1254.5,440.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M1252.5,494.0 L917.5,494.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M917.5,530.0 L582.5,530.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,546.0 L616.5,546.0 L616.5,584.0 L584.5,584.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><rect x="276.9" y="192.0" width="276.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="204.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1. В продукте: «Активировать без сети», ввод</text><rect x="391.4" y="208.0" width="47.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="220.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">ключа</text><rect x="622.5" y="243.0" width="226.5" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="255.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">2. Формирует .alk-req: ключ, продукт,</text><rect x="622.5" y="259.0" width="270.1" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="271.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">instance_id, отпечаток, device_pubkey, nonce;</text><rect x="622.5" y="275.0" width="183.2" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="287.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">подписан ключом устройства</text><rect x="668.2" y="316.0" width="163.6" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="328.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3. Сохраняет файл .alk-req</text><rect x="930.2" y="352.0" width="309.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="364.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">4. Администратор загружает .alk-req в веб-консоль</text><rect x="1037.8" y="368.0" width="94.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="380.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">или на портал</text><rect x="1292.5" y="403.0" width="269.1" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="415.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">5. Проверяет подпись запроса, резервирует</text><rect x="1292.5" y="419.0" width="238.9" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="1296.5" y="431.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">место, создаёт активацию (offline=true)</text><rect x="936.0" y="460.0" width="297.9" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="472.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">6. Выдаёт .alk-lic: аренда (JWS) с длинным сроком</text><rect x="974.4" y="476.0" width="221.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="488.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">по политике, сертификаты цепочки</text><rect x="602.2" y="512.0" width="295.6" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="524.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">7. Администратор импортирует .alk-lic в продукт</text><rect x="622.5" y="547.0" width="249.5" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="559.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">8. Проверяет подпись, nonce, привязку к</text><rect x="622.5" y="563.0" width="182.2" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="626.5" y="575.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">instance_id; сохраняет аренду</text><rect x="492.5" y="602.0" width="850.0" height="30.0" rx="5" ry="5" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.1"/><text x="917.5" y="621.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">Продление — тем же путём до истечения аренды. Освобождение места — файл .alk-req типа release, подтверждённый сервером.</text></svg>