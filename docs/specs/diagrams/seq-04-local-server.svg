<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="916" viewBox="0 0 1500 916"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#4A4A4A" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="916" fill="#FFFFFF"/><text x="30" y="40" font-family="Noto Sans" font-size="21" font-weight="bold" fill="#1A1A1A">П4. Регистрация локального сервера, пакеты лицензий и отчёты об использовании</text><text x="30" y="64" font-family="Noto Sans" font-size="13" fill="#5A5A5A">Подключённый контур — по HTTPS (Sync API). Изолированный — теми же объектами в файлах .alk-req / .alk / .alk-usage.</text><path d="M1252.5,164.0 L1252.5,886.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M917.5,164.0 L917.5,886.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M582.5,164.0 L582.5,886.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M247.5,164.0 L247.5,886.0" stroke="#9A9A9A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="132.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#08427B" stroke="#052E56" stroke-width="1.5"/><text x="247.5" y="136.5" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Оператор АЛМИ</text><rect x="467.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="582.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Центральный сервер</text><text x="582.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#DCEAF8" text-anchor="middle">DEPLOYMENT_MODE=central</text><rect x="802.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="917.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Локальный сервер</text><text x="917.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#DCEAF8" text-anchor="middle">DEPLOYMENT_MODE=local</text><rect x="1137.5" y="100.0" width="230.0" height="64.0" rx="8" ry="8" fill="#6B6B6B" stroke="#4D4D4D" stroke-width="1.5"/><text x="1252.5" y="129.0" font-family="Noto Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Администратор</text><text x="1252.5" y="146.0" font-family="Noto Sans" font-size="11" font-weight="normal" fill="#E6E6E6" text-anchor="middle">заказчика</text><path d="M40,196.0 L1460,196.0" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="3 3"/><path d="M1252.5,258.0 L917.5,258.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M917.5,274.0 L951.5,274.0 L951.5,328.0 L919.5,328.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M917.5,382.0 L582.5,382.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M247.5,434.0 L582.5,434.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,486.0 L917.5,486.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M40,508.0 L1460,508.0" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="3 3"/><path d="M917.5,554.0 L582.5,554.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,606.0 L917.5,606.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><path d="M917.5,622.0 L951.5,622.0 L951.5,676.0 L919.5,676.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M40,700.0 L1460,700.0" stroke="#B5B5B5" stroke-width="1" stroke-dasharray="3 3"/><path d="M917.5,762.0 L582.5,762.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" marker-end="url(#arr)"/><path d="M582.5,798.0 L917.5,798.0" stroke="#4A4A4A" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)"/><rect x="662.7" y="185.0" width="174.7" height="22" rx="11" fill="#EEF3F8" stroke="#B5C7DA"/><text x="750.0" y="200.5" font-family="Noto Sans" font-size="12.5" font-weight="bold" fill="#2F4F6F" text-anchor="middle">Регистрация (один раз)</text><rect x="941.5" y="224.0" width="287.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="236.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">1. Первый запуск: мастер установки, ввод кода</text><rect x="1004.8" y="240.0" width="160.4" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="1085.0" y="252.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">регистрации из договора</text><rect x="957.5" y="275.0" width="287.3" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="961.5" y="287.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">2. Генерирует ключ сервера (не покидает хост),</text><rect x="957.5" y="291.0" width="263.8" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="961.5" y="303.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">формирует запрос с server_id и отпечатком</text><rect x="957.5" y="307.0" width="39.6" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="961.5" y="319.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">хоста</text><rect x="611.4" y="348.0" width="277.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="360.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">3. POST /api/sync/v1/servers/register или файл</text><rect x="685.4" y="364.0" width="129.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="376.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">.alk-req (type=server)</text><rect x="267.4" y="400.0" width="295.2" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="412.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">4. Подтверждает регистрацию, назначает квоты</text><rect x="318.8" y="416.0" width="192.5" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="415.0" y="428.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">лицензий локальному серверу</text><rect x="608.9" y="452.0" width="282.3" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="464.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">5. Сертификат сервера, подписанный ключом</text><rect x="666.6" y="468.0" width="166.7" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="480.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">АЛМИ, + первый пакет .alk</text><rect x="558.7" y="497.0" width="382.6" height="22" rx="11" fill="#EEF3F8" stroke="#B5C7DA"/><text x="750.0" y="512.5" font-family="Noto Sans" font-size="12.5" font-weight="bold" fill="#2F4F6F" text-anchor="middle">Пакет лицензий (по расписанию или при изменениях)</text><rect x="600.5" y="536.0" width="299.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="548.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">6. GET /api/sync/v1/servers/{id}/package?since=seq</text><rect x="598.4" y="572.0" width="303.1" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="584.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">7. Пакет .alk: лицензии, квоты, политики, отзывы,</text><rect x="668.5" y="588.0" width="163.0" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="600.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">seq, срок действия пакета</text><rect x="957.5" y="623.0" width="243.1" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="961.5" y="635.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">8. Проверяет подпись и seq; применяет</text><rect x="957.5" y="639.0" width="284.0" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="961.5" y="651.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">атомарно; старый пакет остаётся до успешной</text><rect x="957.5" y="655.0" width="65.2" height="16" fill="#FFFFFF" fill-opacity="0.9"/><text x="961.5" y="667.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="start">проверки</text><rect x="657.6" y="689.0" width="184.8" height="22" rx="11" fill="#EEF3F8" stroke="#B5C7DA"/><text x="750.0" y="704.5" font-family="Noto Sans" font-size="12.5" font-weight="bold" fill="#2F4F6F" text-anchor="middle">Отчёт об использовании</text><rect x="604.2" y="728.0" width="291.7" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="740.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">9. POST /api/sync/v1/servers/{id}/usage или файл</text><rect x="626.7" y="744.0" width="246.6" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="756.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">.alk-usage: активации, версии, счётчики</text><rect x="603.1" y="780.0" width="293.9" height="16" fill="#FFFFFF" fill-opacity="0.92"/><text x="750.0" y="792.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#1F1F1F" text-anchor="middle">10. Квитанция (подписанная), учтённый период</text><rect x="492.5" y="814.0" width="515.0" height="46.0" rx="5" ry="5" fill="#FFF8DC" stroke="#D9C27A" stroke-width="1.1"/><text x="750.0" y="833.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">Без обмена локальный сервер работает до истечения пакета; за notify_before_days</text><text x="750.0" y="849.0" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#4A3B00" text-anchor="middle">консоль и продукты показывают предупреждение.</text></svg>