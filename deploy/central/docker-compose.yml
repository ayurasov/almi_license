# Central licensing server on one host (docs/deployment.md; docs/specs/07-environments.md).
# Started by install.sh from a checkout of the repository; the images are built on this host.
name: almi-license-central
x-server: &server
  image: almi-license:${ALMI_VERSION}
  pull_policy: never
  restart: unless-stopped
  environment: &server-env
    DEPLOYMENT_MODE: central
    DJANGO_SETTINGS_MODULE: almi_license.settings.prod
    # api and worker: the application role without the rights of the owner (question 38).
    DATABASE_URL: postgres://almi_app@db:5432/almi_license
    DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
    DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret
    DJANGO_ALLOWED_HOSTS: ${SERVER_NAME}
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${SERVER_NAME}
    LEASE_ISSUER: https://${SERVER_NAME}
    SIGNING_KEY_FILE: /run/secrets/issuer_key
    SIGNING_CERT_FILE: /run/secrets/issuer_cert
    TRUST_ROOTS: ${TRUST_ROOTS}
    TRUST_BUNDLE_FILE: ${TRUST_BUNDLE_FILE:-}
    BACKUP_STATUS_FILE: /var/backups/almi/last-success
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  secrets: [app_db_password, django_secret, issuer_key, issuer_cert]
  volumes:
    - ./backups:/var/backups/almi:ro
    - ./trust:/etc/almi/trust:ro
  depends_on:
    migrate: { condition: service_completed_successfully }
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: almi_license
      POSTGRES_USER: almi
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almi -d almi_license"]
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    <<: *server
    command: ["migrate"]
    restart: "no"
    # The owner of the tables migrates and grants the rights of almi_app.
    environment:
      <<: *server-env
      DATABASE_URL: postgres://almi@db:5432/almi_license
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      APP_DATABASE_ROLE: almi_app
      APP_DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
    secrets: [db_password, app_db_password, django_secret, issuer_key, issuer_cert]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *server
    command: ["api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 30
  worker:
    <<: *server
    command: ["worker"]
  console:
    image: almi-license-console:${ALMI_VERSION}
    pull_policy: never
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
  gateway:
    image: nginx:1.27
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME}
      NGINX_ENVSUBST_FILTER: ^SERVER_NAME$
    ports: ["${HTTPS_PORT:-443}:443"]
    volumes:
      - ../local/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api: { condition: service_healthy }
      console: { condition: service_started }
  # Run by backup.sh: docker compose run --rm backup
  backup:
    image: postgres:17
    profiles: [ops]
    entrypoint: ["/ops/backup.sh"]
    environment:
      DATABASE_URL_FILE: /run/secrets/db_url
      BACKUP_DIR: /var/backups/almi
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
    secrets: [db_url, backup_passphrase]
    volumes:
      - ../ops:/ops:ro
      - ./backups:/var/backups/almi
secrets:
  db_password: { file: ./secrets/db_password }
  app_db_password: { file: ./secrets/app_db_password }
  db_url: { file: ./secrets/db_url }
  django_secret: { file: ./secrets/django_secret }
  backup_passphrase: { file: ./secrets/backup_passphrase }
  issuer_key: { file: ./keys/issuer.key }
  issuer_cert: { file: ./keys/issuer.cert.jws }
volumes:
  db: {}
