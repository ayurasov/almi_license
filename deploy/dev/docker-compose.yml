# Local environment (docs/specs/07-environments.md, section 5). Started by make up / make up-local.
# Differences from section 5 are recorded in docs/decisions.md (I0-03).
name: almi-license-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: almi_license
      POSTGRES_USER: almi
      POSTGRES_PASSWORD: dev-only
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almi -d almi_license"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: dev }
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-central}
      DATABASE_URL: postgres://almi:dev-only@db:5432/almi_license
      SIGNING_KEY_FILE: /run/secrets/signing_key
      SIGNING_CERT_FILE: /run/secrets/signing_cert
      DJANGO_SETTINGS_MODULE: almi_license.settings.dev
    secrets: [signing_key, signing_cert]
    volumes: [../../server:/app/server]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    # Not started by make up until the task queue adds "manage.py run_worker" (E12-01).
    profiles: [worker]
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: dev }
    command: python manage.py run_worker
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-central}
      DATABASE_URL: postgres://almi:dev-only@db:5432/almi_license
      DJANGO_SETTINGS_MODULE: almi_license.settings.dev
    volumes: [../../server:/app/server]
    depends_on:
      db: { condition: service_healthy }
  console:
    image: node:22
    working_dir: /app
    # console/ is filled by I2-07; until then the container idles instead of failing npm ci.
    command: sh -c 'if [ -f package.json ]; then npm ci && npm run dev -- --host; else echo "console/ has no package.json yet (I2-07)"; exec sleep infinity; fi'
    volumes: [../../console:/app]
    ports: ["5173:5173"]
  nginx:
    image: nginx:1.27
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:80"]
    depends_on: [api, console]
secrets:
  # Public dev issuer key and its certificate from the reference vectors (E00-04, E02-02).
  signing_key:
    file: ../../contracts/vectors/keys/dev-issuer.key
  signing_cert:
    file: ./secrets/dev-issuer-1.cert.jws
volumes:
  db: {}
