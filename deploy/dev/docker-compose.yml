# Local environment (docs/specs/07-environments.md, section 5). Started by make up / make up-local.
# Differences from section 5 are recorded in docs/decisions.md (I0-03).
name: almi-license-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: almi_license
      POSTGRES_USER: almi
      POSTGRES_PASSWORD: dev-only
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almi -d almi_license"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: dev }
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-central}
      DATABASE_URL: postgres://almi:dev-only@db:5432/almi_license
      SIGNING_KEY_FILE: /run/secrets/signing_key
      SIGNING_CERT_FILE: /run/secrets/signing_cert
      DJANGO_SETTINGS_MODULE: almi_license.settings.dev
    secrets: [signing_key, signing_cert]
    volumes: [../../server:/app/server]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    # Task queue and schedule (E12-01): automatic release and other hourly tasks.
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: dev }
    command: python manage.py run_worker
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-central}
      DATABASE_URL: postgres://almi:dev-only@db:5432/almi_license
      SIGNING_KEY_FILE: /run/secrets/signing_key
      SIGNING_CERT_FILE: /run/secrets/signing_cert
      DJANGO_SETTINGS_MODULE: almi_license.settings.dev
    secrets: [signing_key, signing_cert]
    volumes: [../../server:/app/server]
    depends_on:
      api: { condition: service_healthy }
  console:
    image: node:22
    working_dir: /app
    # console/ is filled by I2-07; until then the container idles instead of failing npm ci.
    command: sh -c 'if [ -f package.json ]; then npm ci && npm run dev -- --host; else echo "console/ has no package.json yet (I2-07)"; exec sleep infinity; fi'
    volumes: [../../console:/app]
    ports: ["5173:5173"]
  # A local server next to the central one (profile "local", E09): its own database, the same
  # image with DEPLOYMENT_MODE=local, the server key on a volume (written by the first-run
  # wizard), the dev root as the trust root. Wizard address of the central server: http://api:8000
  local-db:
    profiles: [local]
    image: postgres:17
    environment:
      POSTGRES_DB: almi_local
      POSTGRES_USER: almi
      POSTGRES_PASSWORD: dev-only
    volumes: [local-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almi -d almi_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  local-api:
    profiles: [local]
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: dev }
    command: sh -c 'python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000'
    environment: &local-env
      DEPLOYMENT_MODE: local
      DATABASE_URL: postgres://almi:dev-only@local-db:5432/almi_local
      DJANGO_SETTINGS_MODULE: almi_license.settings.dev
      LOCAL_SERVER_KEY_FILE: /var/lib/almi/server.key
      TRUST_ROOTS: "dev-root:-GZMEbD2M_QzYMoL5VXjWiBR8Rt-X0YxSwLL_fdCwtQ"
      ALLOW_PLAIN_HTTP_CENTRAL: "true"
    volumes: [../../server:/app/server, local-key:/var/lib/almi]
    ports: ["8090:8000"]
    depends_on:
      local-db: { condition: service_healthy }
  local-sync:
    profiles: [local]
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: dev }
    command: python manage.py sync_package --every 60
    environment: *local-env
    volumes: [../../server:/app/server, local-key:/var/lib/almi]
    depends_on: [local-api]
  local-worker:
    profiles: [local]
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: dev }
    command: python manage.py run_worker
    environment: *local-env
    volumes: [../../server:/app/server, local-key:/var/lib/almi]
    depends_on: [local-api]
  nginx:
    image: nginx:1.27
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:80"]
    depends_on: [api, console]
secrets:
  # Public dev issuer key and its certificate from the reference vectors (E00-04, E02-02).
  signing_key:
    file: ../../contracts/vectors/keys/dev-issuer.key
  signing_cert:
    file: ./dev-issuer-1.cert.jws
volumes:
  db: {}
  local-db: {}
  local-key: {}
