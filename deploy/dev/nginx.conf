# Gateway of the local environment: http://localhost:8080
# Upstreams are resolved per request (Docker DNS), so nginx starts even when
# a service is not up yet and answers 502 for it.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api http://api:8000;
    set $console http://console:5173;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Product API, Sync and admin APIs, legacy /api/activate/
    location /api/ {
        proxy_pass $api;
    }

    # Nextcloud subscription adapter (/apps/zammad_organisation_management/...)
    location /apps/ {
        proxy_pass $api;
    }

    location = /health {
        proxy_pass $api;
    }

    location = /ready {
        proxy_pass $api;
    }

    # Console (Vite dev server with hot reload over WebSocket)
    location / {
        proxy_pass $console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
